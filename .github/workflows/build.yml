name: Build Kasm Chromium ARM64

on:
  workflow_dispatch:

  schedule:
    - cron: "0 4 * * 0"

  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ARM64 Kasm Chromium

    runs-on: ubuntu-24.04-arm

    timeout-minutes: 60

    steps:

      # ---------------------------------------------
      # Checkout our repository
      # ---------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------
      # Get the current Kasm source
      # ---------------------------------------------

      - name: Download current Kasm workspaces-images
        run: |
          git clone \
            --depth 1 \
            https://github.com/kasmtech/workspaces-images.git \
            kasm-source

      # ---------------------------------------------
      # Prepare build context
      # ---------------------------------------------

      - name: Prepare Kasm build context
        run: |
          set -eux

          cp Dockerfile kasm-source/dockerfile-kasm-chrome

          cp install_chromium.sh \
             kasm-source/install_chromium.sh

          cp custom_startup.sh \
             kasm-source/custom_startup.sh

          echo "Build context:"
          ls -lah kasm-source

      # ---------------------------------------------
      # Login to GHCR
      # ---------------------------------------------

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------
      # Buildx
      # ---------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------
      # Build and push
      # ---------------------------------------------

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./kasm-source
          file: ./kasm-source/dockerfile-kasm-chrome

          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/kasm-chromium-arm64:latest
            ghcr.io/${{ github.repository_owner }}/kasm-chromium-arm64:${{ github.sha }}

      # ---------------------------------------------
      # Show image information
      # ---------------------------------------------

      - name: Verify published image
        run: |
          echo "Published:"
          echo "ghcr.io/${{ github.repository_owner }}/kasm-chromium-arm64:latest"
          echo "ghcr.io/${{ github.repository_owner }}/kasm-chromium-arm64:${{ github.sha }}"
